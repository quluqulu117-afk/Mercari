<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>メルカリまとめ買い・同梱損益シミュレーター</title>

  <style>
    :root {
      --primary: #ff333f;
      --primary-soft: #fff1f2;

      --bg: #f8f9fa;
      --surface: #ffffff;

      --text: #212529;
      --text-sub: #6c757d;

      --border: #dee2e6;

      --success: #198754;
      --success-bg: #e8f5e9;

      --warning: #b26a00;
      --warning-bg: #fff7e6;

      --danger: #dc3545;
      --danger-bg: #ffebee;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;

      padding: 12px;
      padding-bottom: 50px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* -------------------------
       Header
    ------------------------- */

    header {
      text-align: center;
      margin-bottom: 16px;
      padding-top: 8px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 3px;
    }

    /* -------------------------
       Card
    ------------------------- */

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;

      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);

      margin-bottom: 12px;

      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-num {
      background: var(--primary);
      color: #fff;

      font-size: 0.7rem;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* -------------------------
       Inputs
    ------------------------- */

    .input-row {
      margin-bottom: 16px;
    }

    .input-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;

      font-size: 0.75rem;
      font-weight: 600;

      color: var(--text-sub);

      margin-bottom: 6px;
    }

    .price-input-wrapper {
      position: relative;
    }

    .price-input-wrapper input {
      width: 100%;
      height: 48px;

      padding: 0 46px 0 14px;

      font-size: 1.1rem;
      font-weight: 700;

      border: 1.5px solid var(--border);
      border-radius: 10px;

      outline: none;

      background: #fafafa;
    }

    .price-input-wrapper input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .price-unit {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;

      pointer-events: none;
    }

    /* -------------------------
       Shipping selector
    ------------------------- */

    .shipping-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .shipping-grid.compact {
      grid-template-columns: repeat(3, 1fr);
    }

    .chip-btn {
      appearance: none;

      background: #f1f3f5;

      border: 1.5px solid transparent;
      border-radius: 8px;

      padding: 8px 4px;

      text-align: center;

      font-size: 0.72rem;
      font-weight: 600;
      color: #495057;

      cursor: pointer;

      min-height: 48px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;
    }

    .chip-btn:active {
      transform: scale(0.97);
    }

    .chip-btn small {
      font-size: 0.61rem;
      color: var(--text-sub);
      font-weight: 400;

      margin-top: 2px;
    }

    .chip-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .chip-btn.active small {
      color: var(--primary);
    }

    /* -------------------------
       Result
    ------------------------- */

    .verdict-card {
      border-radius: var(--radius);

      padding: 16px;

      margin-bottom: 14px;

      transition: all 0.2s ease;

      border: 2px solid transparent;
    }

    .verdict-card.gain {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .verdict-card.warning {
      background: var(--warning-bg);
      border-color: var(--warning);
    }

    .verdict-card.loss {
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .verdict-badge {
      display: inline-block;

      font-size: 0.72rem;
      font-weight: 700;

      padding: 4px 8px;

      border-radius: 6px;

      color: #fff;

      margin-bottom: 8px;
    }

    .verdict-card.gain .verdict-badge {
      background: var(--success);
    }

    .verdict-card.warning .verdict-badge {
      background: var(--warning);
    }

    .verdict-card.loss .verdict-badge {
      background: var(--danger);
    }

    .verdict-title {
      font-size: 1.13rem;
      font-weight: 800;

      margin-bottom: 4px;

      letter-spacing: -0.3px;
    }

    .verdict-sub {
      font-size: 0.72rem;
      color: var(--text-sub);

      margin-bottom: 12px;
    }

    /* -------------------------
       Stats
    ------------------------- */

    .stat-list {
      background: rgba(255, 255, 255, 0.82);

      border-radius: 9px;

      padding: 10px 12px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      font-size: 0.82rem;

      padding: 4px 0;
    }

    .stat-item span:last-child {
      font-weight: 600;
      text-align: right;
    }

    .stat-item.highlight {
      border-top: 1px dashed rgba(0, 0, 0, 0.15);

      margin-top: 5px;
      padding-top: 8px;

      font-weight: 700;
      font-size: 0.95rem;
    }

    .stat-item.max-discount {
      color: var(--primary);
      font-weight: 700;

      margin-top: 4px;
    }

    /* -------------------------
       Detail breakdown
    ------------------------- */

    .breakdown {
      margin-top: 10px;

      padding: 10px 12px;

      background: rgba(255, 255, 255, 0.6);

      border-radius: 8px;
    }

    .breakdown-title {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: 700;

      margin-bottom: 5px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;

      font-size: 0.72rem;
      color: var(--text-sub);

      padding: 2px 0;
    }

    /* -------------------------
       Buttons
    ------------------------- */

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;

      margin-top: 10px;
    }

    .quick-discount-btn {
      border: 1px solid var(--border);

      background: #fff;

      border-radius: 7px;

      padding: 8px 4px;

      font-size: 0.7rem;
      font-weight: 600;

      cursor: pointer;
    }

    .quick-discount-btn:active {
      transform: scale(0.97);
    }

    .quick-apply-btn {
      display: block;

      width: 100%;

      background: #fff;

      border: 1px solid var(--primary);

      border-radius: 8px;

      padding: 9px 8px;

      font-size: 0.73rem;
      font-weight: 700;
      color: var(--primary);

      margin-top: 7px;

      cursor: pointer;
    }

    .quick-apply-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* -------------------------
       Template
    ------------------------- */

    .template-box {
      margin-top: 14px;
    }

    .template-textarea {
      width: 100%;
      min-height: 145px;

      padding: 10px;

      font-size: 0.8rem;
      line-height: 1.5;

      border: 1.5px solid var(--border);
      border-radius: 8px;

      resize: vertical;

      background: #fff;

      outline: none;
    }

    .template-textarea:focus {
      border-color: var(--primary);
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      width: 100%;
      height: 46px;

      background: #212529;
      color: #fff;

      border: none;
      border-radius: 10px;

      font-size: 0.85rem;
      font-weight: 700;

      cursor: pointer;

      margin-top: 8px;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    /* -------------------------
       Info
    ------------------------- */

    .info-box {
      margin-top: 12px;

      padding: 10px;

      border-radius: 8px;

      background: #f8f9fa;

      font-size: 0.68rem;
      color: var(--text-sub);

      line-height: 1.55;
    }

    /* -------------------------
       Toast
    ------------------------- */

    #toast {
      position: fixed;

      bottom: 24px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(100px);

      background: rgba(33, 37, 41, 0.94);
      color: #fff;

      padding: 10px 18px;

      border-radius: 30px;

      font-size: 0.8rem;
      font-weight: 600;

      pointer-events: none;

      transition:
        transform 0.25s
        cubic-bezier(0.175, 0.885, 0.32, 1.275);

      z-index: 1000;

      white-space: nowrap;
    }

    #toast.show {
      transform:
        translateX(-50%)
        translateY(0);
    }

    @media (max-width: 360px) {
      .shipping-grid.compact {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app-container">

  <header>

        <button

          ゆうパケP
          <small>215円</small>
        </button>

        <button
          type="button"

        >
          コンパクト

        </button>

        <button

        >
          ゆうパケ+
          <small>送料＋箱 520円</small>
        </button>

        <button
          type="button"

        >

    <div class="breakdown">

      <span id="quickMaxVal">0</span>
      円を反映
    </button>


    <div class="template-box">

      <label style="color: inherit;">

        class="btn-action"
        onclick="copyTemplate()"

      </button>

    <div class="info-box">

      梱包材など追加費用が発生する場合は、実際の発送コストに合わせて調整してください。
    </div>

  </section>

</div>


<div id="toast">
  コピーしました

<script>

  const MIN_PRICE = 300;
  const FEE_RATE = 0.10;

  let calculatedMaxDiscount = 0;


  /* =================================
     チップ選択
  ================================= */

  document
    .querySelectorAll(".chip-group")
    .forEach(group => {

      const targetInputId =
        group.getAttribute("data-target");

      const hiddenInput =
        document.getElementById(targetInputId);

      group
        .querySelectorAll(".chip-btn")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              group
                .querySelectorAll(".chip-btn")
                .forEach(btn =>
                  btn.classList.remove("active")
                );

              button.classList.add("active");

              hiddenInput.value =
                Number(
                  button.getAttribute("data-val")
                );

              recalculate();

            }
          );

        });

    });


  /* =================================
     数値入力
  ================================= */

  document
    .querySelectorAll('input[type="number"]')
    .forEach(input => {

      input.addEventListener(
        "input",
        recalculate
      );

      input.addEventListener(
        "blur",
        normalizeInputs
      );

    });


  /* =================================
     メルカリ手数料
  ================================= */

  function calculateFee(price) {

    /*
      販売価格の10%。

      Math.floor を使い、
      利益計算と限界値引き計算で
      完全に同じ式を使用する。
    */

    return Math.floor(
      price * FEE_RATE
    );

  }


  /* =================================
     手取り
  ================================= */

  function calculateProfit(
    price,
    shipping
  ) {

    const fee =
      calculateFee(price);

    return (
      price
      - fee
      - shipping
    );

  }


  /* =================================
     限界値引き探索

     別送時の手取りを
     1円でも下回らない最大値引き
  ================================= */

  function findMaxDiscount(
    totalPrice,
    bundleShipping,
    separateProfit
  ) {

    const maxPossibleDiscount =
      Math.max(
        0,
        totalPrice - MIN_PRICE
      );

    let maxDiscount = 0;


    for (
      let discount = 0;
      discount <= maxPossibleDiscount;
      discount++
    ) {

      const bundlePrice =
        totalPrice - discount;

      const bundleProfit =
        calculateProfit(
          bundlePrice,
          bundleShipping
        );


      if (
        bundleProfit >=
        separateProfit
      ) {

        maxDiscount =
          discount;

      } else {

        /*
          値引きが増えるほど
          基本的に利益は減るため、
          ここで終了できる
        */

        break;

      }

    }


    return maxDiscount;

  }


  /* =================================
     メイン計算
  ================================= */

  function recalculate() {

    /* ----------
       入力取得
    ---------- */

    const rawPA =
      Number(
        document
          .getElementById("priceA")
          .value
      ) || 0;

    const rawPB =
      Number(
        document
          .getElementById("priceB")
          .value
      ) || 0;


    const pA =
      Math.max(
        MIN_PRICE,
        rawPA
      );

    const pB =
      Math.max(
        MIN_PRICE,
        rawPB
      );


    const sA =
      Number(
        document
          .getElementById("shipA")
          .value
      );

    const sB =
      Number(
        document
          .getElementById("shipB")
          .value
      );

    const sBundle =
      Number(
        document
          .getElementById("shipBundle")
          .value
      );


    let discount =
      Math.max(
        0,
        Number(
          document
            .getElementById("discount")
            .value
        ) || 0
      );


    /* ----------
       合計販売価格
    ---------- */

    const originalTotalPrice =
      pA + pB;


    /*
      合計300円未満にはしない
    */

    const maximumAllowedDiscount =
      Math.max(
        0,
        originalTotalPrice
        - MIN_PRICE
      );


    discount =
      Math.min(
        discount,
        maximumAllowedDiscount
      );


    /* ----------
       別送
    ---------- */

    const feeA =
      calculateFee(pA);

    const feeB =
      calculateFee(pB);

    const profitA =
      calculateProfit(
        pA,
        sA
      );

    const profitB =
      calculateProfit(
        pB,
        sB
      );

    const totalSeparateProfit =
      profitA + profitB;


    /* ----------
       同梱
    ---------- */

    const bundlePrice =
      originalTotalPrice
      - discount;

    const bundleFee =
      calculateFee(
        bundlePrice
      );

    const totalBundleProfit =
      calculateProfit(
        bundlePrice,
        sBundle
      );


    /* ----------
       差額
    ---------- */

    const diff =
      totalBundleProfit
      - totalSeparateProfit;


    /* ----------
       限界値引き
    ---------- */

    calculatedMaxDiscount =
      findMaxDiscount(
        originalTotalPrice,
        sBundle,
        totalSeparateProfit
      );


    /* ----------
       差額内訳
    ---------- */

    const separateShipping =
      sA + sB;

    const shippingSavings =
      separateShipping
      - sBundle;


    const separateFee =
      feeA + feeB;

    const feeChange =
      separateFee
      - bundleFee;


    /* ----------
       DOM
    ---------- */

    const card =
      document.getElementById(
        "verdictCard"
      );

    const badge =
      document.getElementById(
        "verdictBadge"
      );

    const title =
      document.getElementById(
        "verdictTitle"
      );

    const sub =
      document.getElementById(
        "verdictSub"
      );

    const statDiff =
      document.getElementById(
        "statDiff"
      );

    const template =
      document.getElementById(
        "replyTemplate"
      );


    /* ----------
       数値表示
    ---------- */

    setText(
      "statSeparateProfit",
      money(totalSeparateProfit)
    );

    setText(
      "statBundlePrice",
      money(bundlePrice)
    );

    setText(
      "statBundleProfit",
      money(totalBundleProfit)
    );

    setText(
      "statMaxDiscount",
      calculatedMaxDiscount
        .toLocaleString()
      + " 円まで"
    );

    setText(
      "quickMaxVal",
      calculatedMaxDiscount
        .toLocaleString()
    );


    setSignedMoney(
      "shippingDiff",
      shippingSavings
    );

    setText(
      "discountDiff",
      "-" +
      discount.toLocaleString()
      + " 円"
    );

    setSignedMoney(
      "feeDiff",
      feeChange
    );


    /* =================================
       判定

       1. 同梱で手取り増
       2. 手取り減だが利益自体はプラス
       3. 同梱後利益がマイナス
    ================================= */

    if (
      totalBundleProfit < 0
    ) {

      /* ----------
         本当に赤字
      ---------- */

      card.className =
        "verdict-card loss";

      badge.textContent =
        "同梱非推奨";

      title.textContent =
        "同梱すると赤字になります";

      sub.textContent =
        "送料と販売手数料が販売価格を上回ります。";

      statDiff.textContent =
        formatSigned(diff);

      statDiff.style.color =
        "var(--danger)";


      template.value =
`まとめ買いのご依頼ありがとうございます。

確認したところ、2点を同梱すると梱包サイズが大きくなり、送料負担が高くなってしまうため、ご希望の条件でのおまとめが難しい状況です。

恐れ入りますが、今回は個別でのご購入をご検討いただけますと幸いです。
よろしくお願いいたします。`;


    } else if (
      diff >= 0
    ) {

      /* ----------
         同梱有利
      ---------- */

      card.className =
        "verdict-card gain";

      badge.textContent =
        "同梱OK";

      if (diff === 0) {

        title.textContent =
          "別送時と同じ手取りです";

      } else {

        title.textContent =
          "手取りが +" +
          diff.toLocaleString()
          + " 円増えます";

      }


      sub.textContent =
        "現在の値引き条件なら、別送より不利になりません。";


      statDiff.textContent =
        formatSigned(diff);

      statDiff.style.color =
        "var(--success)";


      template.value =
`まとめ買いのご依頼ありがとうございます！

ご希望の内容でおまとめ・お値引き可能です。
価格を調整いたしますので、内容をご確認のうえご購入いただけますと幸いです。

よろしくお願いいたします。`;


    } else {

      /* ----------
         赤字ではないが
         別送より手取り減
      ---------- */

      card.className =
        "verdict-card warning";

      badge.textContent =
        "値引き調整推奨";

      title.textContent =
        "別送より手取りが "
        + Math.abs(diff)
          .toLocaleString()
        + " 円減ります";

      sub.textContent =
        "赤字ではありませんが、別送時より利益が減ります。";


      statDiff.textContent =
        formatSigned(diff);

      statDiff.style.color =
        "var(--warning)";


      if (
        calculatedMaxDiscount > 0
      ) {

        template.value =
`まとめ買いのご依頼ありがとうございます。

2点を同梱すると梱包サイズが大きくなり送料が上がってしまうため、ご希望の値引き額ですと送料負担が大きくなってしまいます。

${calculatedMaxDiscount.toLocaleString()}円引きまででしたらおまとめ可能ですので、こちらのお値引き額でよろしければ対応させていただきます。

ご検討よろしくお願いいたします。`;

      } else {

        template.value =
`まとめ買いのご依頼ありがとうございます。

確認したところ、2点を同梱すると梱包サイズが大きくなり送料が上がってしまうため、値引きをすると別々に発送する場合より送料負担が大きくなってしまいます。

恐れ入りますが、今回は個別でのご購入をご検討いただけますと幸いです。

よろしくお願いいたします。`;

      }

    }


    /* ----------
       限界値引きボタン
    ---------- */

    document
      .getElementById(
        "btnApplyMax"
      )
      .disabled =
        calculatedMaxDiscount <= 0;

  }


  /* =================================
     値引きセット
  ================================= */

  function setDiscount(
    value
  ) {

    document
      .getElementById(
        "discount"
      )
      .value =
        value;

    recalculate();

  }


  /* =================================
     限界値引きを適用
  ================================= */

  function applyMaxDiscount() {

    document
      .getElementById(
        "discount"
      )
      .value =
        calculatedMaxDiscount;

    recalculate();

    showToast(
      "限界値引き額を反映しました"
    );

  }


  /* =================================
     入力補正
  ================================= */

  function normalizeInputs() {

    const priceA =
      document.getElementById(
        "priceA"
      );

    const priceB =
      document.getElementById(
        "priceB"
      );

    const discount =
      document.getElementById(
        "discount"
      );


    if (
      Number(priceA.value)
      < MIN_PRICE
    ) {

      priceA.value =
        MIN_PRICE;

    }


    if (
      Number(priceB.value)
      < MIN_PRICE
    ) {

      priceB.value =
        MIN_PRICE;

    }


    if (
      Number(discount.value)
      < 0
    ) {

      discount.value = 0;

    }


    recalculate();

  }


  /* =================================
     コピー
  ================================= */

  async function copyTemplate() {

    const text =
      document
        .getElementById(
          "replyTemplate"
        )
        .value;


    try {

      await navigator
        .clipboard
        .writeText(text);

      showToast(
        "返信文をコピーしました"
      );

    } catch (error) {

      /*
        file:// などで
        Clipboard APIが使えない場合
      */

      const textarea =
        document.getElementById(
          "replyTemplate"
        );

      textarea.focus();
      textarea.select();

      document.execCommand(
        "copy"
      );

      showToast(
        "返信文をコピーしました"
      );

    }

  }


  /* =================================
     Toast
  ================================= */

  function showToast(
    message
  ) {

    const toast =
      document.getElementById(
        "toast"
      );

    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );


    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

  }


  /* =================================
     Utility
  ================================= */

  function money(
    value
  ) {

    return (
      value.toLocaleString()
      + " 円"
    );

  }


  function formatSigned(
    value
  ) {

    if (
      value > 0
    ) {

      return (
        "+"
        + value.toLocaleString()
        + " 円"
      );

    }


    if (
      value < 0
    ) {

      return (
        "-"
        + Math.abs(value)
          .toLocaleString()
        + " 円"
      );

    }


    return "±0 円";

  }


  function setSignedMoney(
    id,
    value
  ) {

    document
      .getElementById(id)
      .textContent =
        formatSigned(value);

  }


  function setText(
    id,
    text
  ) {

    document
      .getElementById(id)
      .textContent =
        text;

  }


  /* =================================
     初期計算
  ================================= */

  recalculate();

</script>

</body>
</html>
